<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Eyewear Size & Face Shape Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

  <div class="max-w-xl w-full bg-slate-900 rounded-3xl p-6 shadow-2xl border border-slate-800 space-y-4">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-white">Find Your Glasses Size</h1>
      <p class="text-slate-400 text-sm">Hold any standard card flat against your forehead (50–70 cm away)</p>
    </div>

    <!-- Status Badge (Above Camera) -->
    <div class="flex justify-center">
      <div id="statusPill" class="bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2 transition-all duration-300">
        <span id="statusIcon">💳</span>
        <span id="statusText">Hold card flat on forehead</span>
      </div>
    </div>

    <!-- Camera Feed -->
    <div class="relative w-full aspect-[4/3] bg-slate-950 rounded-2xl overflow-hidden shadow-inner border border-slate-800 flex items-center justify-center">
      <video id="webcam" class="hidden" playsinline></video>
      <canvas id="output_canvas" class="w-full h-full object-cover -scale-x-100"></canvas>
      
      <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 text-sky-400 font-medium text-base p-6 text-center">
        <span>Initializing camera...</span>
      </div>
    </div>

    <!-- Capture Action Button -->
    <div class="flex justify-center">
      <button id="captureBtn" class="w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-base rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2">
        <span>📸 Capture & Analyze</span>
      </button>
    </div>

    <!-- Result Card & Recommendations -->
    <div id="resultsContainer" class="space-y-4 hidden">
      
      <!-- Size & Measurements -->
      <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 text-center space-y-1">
        <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Your Size Recommendation</span>
        <div id="sizeOutput" class="text-3xl font-extrabold text-sky-400">--</div>
        <p id="mmSubtext" class="text-xs text-slate-400">Measured Head Width: --</p>
      </div>

      <!-- Face Shape Classification -->
      <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 text-center space-y-1">
        <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Detected Face Shape</span>
        <div id="shapeOutput" class="text-3xl font-extrabold text-amber-400">--</div>
        <p id="shapeDesc" class="text-xs text-slate-400">--</p>
      </div>

      <!-- Style Recommendation -->
      <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex items-center space-x-2 border-b border-slate-800 pb-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Website Style Guide Match</span>
        </div>
        
        <div class="space-y-1">
          <span class="text-xs text-slate-400 uppercase tracking-wide">Best Frame Choice:</span>
          <h3 id="bestChoiceTitle" class="text-lg font-bold text-slate-100">--</h3>
        </div>

        <div class="space-y-1 pt-1">
          <span class="text-xs text-slate-400 uppercase tracking-wide">Why It Works:</span>
          <p id="whyItWorksText" class="text-xs text-slate-300 leading-relaxed">--</p>
        </div>
      </div>

    </div>

  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const loadingDiv = document.getElementById('loading');
    
    const statusPill = document.getElementById('statusPill');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');
    const captureBtn = document.getElementById('captureBtn');

    const resultsContainer = document.getElementById('resultsContainer');
    const sizeOutput = document.getElementById('sizeOutput');
    const mmSubtext = document.getElementById('mmSubtext');
    const shapeOutput = document.getElementById('shapeOutput');
    const shapeDesc = document.getElementById('shapeDesc');
    const bestChoiceTitle = document.getElementById('bestChoiceTitle');
    const whyItWorksText = document.getElementById('whyItWorksText');

    const CARD_LONG_EDGE_MM = 85.60;
    const CARD_SHORT_EDGE_MM = 53.98;
    const CARD_ASPECT = CARD_LONG_EDGE_MM / CARD_SHORT_EDGE_MM; // 1.5858

    let isCaptured = false;
    let currentLandmarks = null;

    const FACE_RULES = {
      "Round": {
        best: "Rectangular & Angular frames.",
        why: "Sharp horizontal lines add structure, elongating your face and thinning your cheeks."
      },
      "Oval": {
        best: "Any frame shape.",
        why: "Oval faces feature naturally balanced symmetry. Just ensure frames are slightly wider than the broadest part of your face."
      },
      "Oblong": {
        best: "Tall, Oversized, or Decorative frames.",
        why: "Tall lenses and decorative temples break up vertical face length, balancing longer features."
      },
      "Heart-Shaped": {
        best: "Cat-Eye & Bottom-Heavy frames.",
        why: "Wider top dimensions or low-slung frames balance out a tapering chin line."
      },
      "Square & Angular": {
        best: "Round, Oval, & Aviator frames.",
        why: "Curved, softer lens profiles soften prominent jawlines and broad foreheads."
      }
    };

    captureBtn.addEventListener('click', () => {
      if (!isCaptured) {
        if (!currentLandmarks) {
          alert("No face detected yet! Position your face in camera view and try again.");
          return;
        }
        isCaptured = true;
        runEdgeCardAnalysis();
        captureBtn.innerHTML = "<span>🔄 Retake Photo</span>";
        captureBtn.className = "w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-extrabold text-base rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 border border-slate-700";
      } else {
        isCaptured = false;
        resultsContainer.classList.add('hidden');
        captureBtn.innerHTML = "<span>📸 Capture & Analyze</span>";
        captureBtn.className = "w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-base rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2";
        statusPill.className = "bg-emerald-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
        statusIcon.innerText = "✅";
        statusText.innerText = "Ready - Tap Capture";
      }
    });

    function getAngleDeg(A, B, C, w, h) {
      const Ax = A.x * w, Ay = A.y * h;
      const Bx = B.x * w, By = B.y * h;
      const Cx = C.x * w, Cy = C.y * h;
      const rad = Math.atan2(Cy - By, Cx - Bx) - Math.atan2(Ay - By, Ax - Bx);
      let deg = Math.abs(rad * 180 / Math.PI);
      if (deg > 180) deg = 360 - deg;
      return deg;
    }

    // Detects cards whether centered, displaced left/right, OR held vertically/horizontally
    function detectCardByEdges(ctx, w, h, landmarks) {
      const p127 = landmarks[127];
      const p356 = landmarks[356];
      const pBrowL = landmarks[105];
      const pBrowR = landmarks[334];
      const pChin = landmarks[152];
      const pNose = landmarks[6];

      const faceW = Math.hypot((p356.x - p127.x) * w, (p356.y - p127.y) * h);
      const browY = Math.min(pBrowL.y, pBrowR.y) * h;
      const faceH = Math.hypot((pChin.x - pNose.x) * w, (pChin.y - pNose.y) * h) * 1.55;
      const centerX = ((p127.x + p356.x) / 2) * w;

      // Wide forehead ROI (allows off-center left/right displacement AND taller upward reach for vertical cards)
      const roiX1 = Math.max(2, Math.round(centerX - faceW * 0.56));
      const roiX2 = Math.min(w - 3, Math.round(centerX + faceW * 0.56));
      const roiY2 = Math.max(12, Math.round(browY - faceH * 0.03));
      const roiY1 = Math.max(2, Math.round(browY - faceH * 0.52));

      const roiW = roiX2 - roiX1;
      const roiH = roiY2 - roiY1;
      if (roiW <= 30 || roiH <= 20) return null;

      const imgData = ctx.getImageData(roiX1, roiY1, roiW, roiH).data;

      // Convert ROI to grayscale luminance
      const gray = new Float32Array(roiW * roiH);
      for (let i = 0; i < roiW * roiH; i++) {
        const idx = i * 4;
        gray[i] = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
      }

      // Focus vertical edge scan in the lower 65% of the ROI (where both horizontal AND vertical cards sit on the forehead, avoiding fingers at the top)
      const scanYStart = Math.floor(roiH * 0.30);
      const scanYEnd = roiH - 2;
      const scanHeight = Math.max(1, scanYEnd - scanYStart);

      const vertEdgeProfile = new Float32Array(roiW);
      for (let y = scanYStart; y < scanYEnd; y++) {
        for (let x = 2; x < roiW - 2; x++) {
          const gx = Math.abs(gray[y * roiW + (x + 1)] - gray[y * roiW + (x - 1)]) +
                     0.5 * Math.abs(gray[y * roiW + (x + 2)] - gray[y * roiW + (x - 2)]);
          if (gx > 12) {
            vertEdgeProfile[x] += gx;
          }
        }
      }

      const smoothVert = new Float32Array(roiW);
      for (let x = 1; x < roiW - 1; x++) {
        smoothVert[x] = (vertEdgeProfile[x - 1] + vertEdgeProfile[x] * 2 + vertEdgeProfile[x + 1]) / 4;
      }

      // Collect all strong vertical edge peaks across the entire forehead width (allows displaced left/right cards!)
      const edgeThreshold = scanHeight * 7.5;
      const peaks = [];
      for (let x = 4; x < roiW - 4; x++) {
        if (smoothVert[x] >= edgeThreshold &&
            smoothVert[x] >= smoothVert[x - 1] &&
            smoothVert[x] >= smoothVert[x + 1]) {
          peaks.push({ x, score: smoothVert[x] });
        }
      }

      if (peaks.length < 2) return null;

      // Valid physical pixel widths for a card relative to human head width (120mm - 165mm):
      // Horizontal card (85.6mm) = ~46% to 72% of faceW
      // Vertical card (53.98mm)  = ~29% to 45% of faceW
      const minVertW = faceW * 0.29;
      const maxVertW = faceW * 0.45;
      const minHorizW = faceW * 0.46;
      const maxHorizW = faceW * 0.72;

      // Evaluate all candidate (left, right) pairs that match a standard card width (either horizontal or vertical)
      let bestPair = null;
      let bestPairScore = -1;

      for (let i = 0; i < peaks.length; i++) {
        for (let j = i + 1; j < peaks.length; j++) {
          const span = peaks[j].x - peaks[i].x;
          const isHoriz = span >= minHorizW && span <= maxHorizW;
          const isVert = span >= minVertW && span <= maxVertW;
          if (!isHoriz && !isVert) continue;

          // Score pair by edge strength, favoring outer physical borders over inner text lines
          const pairMid = (peaks[i].x + peaks[j].x) / 2;
          const distFromCenterPenalty = Math.abs(pairMid - roiW / 2) * 0.15;
          const score = peaks[i].score + peaks[j].score - distFromCenterPenalty;

          if (score > bestPairScore) {
            bestPairScore = score;
            bestPair = {
              leftX: peaks[i].x,
              rightX: peaks[j].x,
              width: span,
              isVertical: isVert
            };
          }
        }
      }

      if (!bestPair) return null;

      // Locate bottom edge of card using horizontal gradient between bestPair.leftX and bestPair.rightX
      const horizEdgeProfile = new Float32Array(roiH);
      for (let y = 2; y < roiH - 2; y++) {
        for (let x = bestPair.leftX + 2; x < bestPair.rightX - 2; x++) {
          const gy = Math.abs(gray[(y + 1) * roiW + x] - gray[(y - 1) * roiW + x]);
          if (gy > 10) horizEdgeProfile[y] += gy;
        }
      }

      let bestBottomY = roiH - 2;
      const horizThreshold = bestPair.width * 7.0;
      for (let y = roiH - 2; y >= Math.floor(roiH * 0.55); y--) {
        if (horizEdgeProfile[y] >= horizThreshold) {
          bestBottomY = y;
          break;
        }
      }

      // Compute exact card height from ISO aspect ratio (1.5858)
      const expectedHeight = bestPair.isVertical
        ? Math.round(bestPair.width * CARD_ASPECT)
        : Math.round(bestPair.width / CARD_ASPECT);

      const bestTopY = Math.max(0, bestBottomY - expectedHeight);

      return {
        x: roiX1 + bestPair.leftX,
        y: roiY1 + bestTopY,
        width: bestPair.width,
        height: expectedHeight,
        isVertical: bestPair.isVertical
      };
    }

    function runEdgeCardAnalysis() {
      const w = canvasElement.width;
      const h = canvasElement.height;
      const landmarks = currentLandmarks;

      const fullCanvas = document.createElement('canvas');
      fullCanvas.width = w;
      fullCanvas.height = h;
      const fullCtx = fullCanvas.getContext('2d');
      fullCtx.drawImage(videoElement, 0, 0, w, h);

      const p127 = landmarks[127];
      const p356 = landmarks[356];
      const pt127 = { x: p127.x * w, y: p127.y * h };
      const pt356 = { x: p356.x * w, y: p356.y * h };
      const facePixelWidth = Math.hypot(pt356.x - pt127.x, pt356.y - pt127.y);

      const cardBox = detectCardByEdges(fullCtx, w, h, landmarks);

      if (!cardBox) {
        alert("Could not clearly detect the card edges on your forehead. Hold the card flat above your eyebrows in good lighting (50–70 cm from camera) and try again.");
        statusPill.className = "bg-rose-500 text-white font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
        statusIcon.innerText = "❌";
        statusText.innerText = "Card edges not found - Retake";
        return;
      }

      // Draw captured frame + locked green card box + temple line
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);
      canvasCtx.drawImage(fullCanvas, 0, 0, w, h);

      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeRect(cardBox.x, cardBox.y, cardBox.width, cardBox.height);
      canvasCtx.fillStyle = 'rgba(34, 197, 94, 0.18)';
      canvasCtx.fillRect(cardBox.x, cardBox.y, cardBox.width, cardBox.height);

      canvasCtx.strokeStyle = '#eab308';
      canvasCtx.lineWidth = 3;
      canvasCtx.beginPath();
      canvasCtx.moveTo(pt127.x, pt127.y);
      canvasCtx.lineTo(pt356.x, pt356.y);
      canvasCtx.stroke();
      canvasCtx.restore();

      // Exact math from validated index (1).html (with automatic horizontal vs vertical card edge selection)
      const realCardWidthMm = cardBox.isVertical ? CARD_SHORT_EDGE_MM : CARD_LONG_EDGE_MM;
      const scaleFrontal = cardBox.width / realCardWidthMm;
      const rawMm = facePixelWidth / scaleFrontal;
      const trueWidthMm = rawMm * 1.125;

      if (trueWidthMm < 133.0) {
        sizeOutput.innerText = "SMALL";
        sizeOutput.className = "text-3xl font-extrabold text-blue-400";
      } else if (trueWidthMm < 140.0) {
        sizeOutput.innerText = "MEDIUM";
        sizeOutput.className = "text-3xl font-extrabold text-emerald-400";
      } else {
        sizeOutput.innerText = "LARGE";
        sizeOutput.className = "text-3xl font-extrabold text-purple-400";
      }
      mmSubtext.innerText = `Measured Head Width: ${trueWidthMm.toFixed(1)} mm (${cardBox.isVertical ? 'Vertical' : 'Horizontal'} Card)`;

      // Multi-factor face shape classification
      const p10 = landmarks[10], p152 = landmarks[152];
      const p234 = landmarks[234], p454 = landmarks[454];
      const p58 = landmarks[58], p288 = landmarks[288];
      const p172 = landmarks[172], p397 = landmarks[397];
      const p6 = landmarks[6];

      const cheekWidth = Math.hypot((p454.x - p234.x) * w, (p454.y - p234.y) * h);
      const jawCornerWidth = Math.hypot((p288.x - p58.x) * w, (p288.y - p58.y) * h);
      const jawLowerWidth = Math.hypot((p397.x - p172.x) * w, (p397.y - p172.y) * h);
      
      const midFaceHeight = Math.hypot((p152.x - p6.x) * w, (p152.y - p6.y) * h) * 1.50;
      const rawFaceHeight = Math.hypot((p152.x - p10.x) * w, (p152.y - p10.y) * h);
      const faceHeight = Math.max(rawFaceHeight, midFaceHeight);

      const upperWidth = Math.max(cheekWidth, facePixelWidth);
      const aspectRatio = faceHeight / upperWidth;
      const jawToCheekRatio = jawCornerWidth / upperWidth;
      const upperToJawRatio = upperWidth / jawLowerWidth;

      const angleLeft = getAngleDeg(p127, p58, p152, w, h);
      const angleRight = getAngleDeg(p356, p288, p152, w, h);
      const jawAngleDeg = (angleLeft + angleRight) / 2;

      const scores = { "Round": 0, "Oval": 0, "Oblong": 0, "Heart-Shaped": 0, "Square & Angular": 0 };

      if (upperToJawRatio >= 1.25) {
        scores["Heart-Shaped"] += 4;
        if (upperToJawRatio >= 1.30) scores["Heart-Shaped"] += 2;
      }
      if (aspectRatio >= 1.38) {
        scores["Oblong"] += 4;
        scores["Oval"] += 1;
      } else if (aspectRatio >= 1.25 && aspectRatio < 1.38) {
        scores["Oval"] += 3;
        scores["Heart-Shaped"] += 1;
      } else { 
        scores["Round"] += 3;
        scores["Square & Angular"] += 2;
      }
      if (jawToCheekRatio >= 0.86 && jawAngleDeg < 125) {
        scores["Square & Angular"] += 4;
      } else if (jawAngleDeg >= 125 || jawToCheekRatio <= 0.82) {
        scores["Round"] += 3;
        scores["Oval"] += 2;
        scores["Heart-Shaped"] += 1;
      }
      if (aspectRatio < 1.26 && jawAngleDeg >= 122) {
        scores["Round"] += 3;
      }

      let winningShape = "Oval";
      let maxScore = -1;
      for (const [shape, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          winningShape = shape;
        }
      }

      shapeOutput.innerText = winningShape;
      shapeDesc.innerText = `Facial features match a ${winningShape.toLowerCase()} profile.`;

      const rec = FACE_RULES[winningShape];
      bestChoiceTitle.innerText = rec.best;
      whyItWorksText.innerText = rec.why;

      resultsContainer.classList.remove('hidden');
      statusPill.className = "bg-emerald-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
      statusIcon.innerText = "✅";
      statusText.innerText = "Calibration Complete";
    }

    function onResults(results) {
      if (loadingDiv && !loadingDiv.classList.contains('hidden')) {
        loadingDiv.classList.add('hidden');
      }

      if (isCaptured) return;

      canvasElement.width = videoElement.videoWidth || 1280;
      canvasElement.height = videoElement.videoHeight || 720;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      const w = canvasElement.width;
      const h = canvasElement.height;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        currentLandmarks = results.multiFaceLandmarks[0];

        const p127 = currentLandmarks[127];
        const p356 = currentLandmarks[356];
        const pBrowL = currentLandmarks[105];
        const pBrowR = currentLandmarks[334];

        const pt127 = { x: p127.x * w, y: p127.y * h };
        const pt356 = { x: p356.x * w, y: p356.y * h };
        const facePixelWidth = Math.hypot(pt356.x - pt127.x, pt356.y - pt127.y);
        const browY = Math.min(pBrowL.y, pBrowR.y) * h;

        const guideW = facePixelWidth * 0.58;
        const guideH = guideW / CARD_ASPECT;
        const boxX = ((p127.x + p356.x) / 2) * w - (guideW / 2);
        const boxY = browY - guideH - (facePixelWidth * 0.04);

        canvasCtx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
        canvasCtx.lineWidth = 3;
        canvasCtx.setLineDash([8, 6]);
        canvasCtx.strokeRect(boxX, boxY, guideW, guideH);
        canvasCtx.setLineDash([]);

        // Distance guidance to keep user in the accurate 50–70 cm sweet spot
        const faceRatio = facePixelWidth / w;
        if (faceRatio > 0.34) {
          statusPill.className = "bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
          statusIcon.innerText = "↔️";
          statusText.innerText = "Too close — move back to 50–70 cm";
        } else if (faceRatio < 0.16) {
          statusPill.className = "bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
          statusIcon.innerText = "↔️";
          statusText.innerText = "Move slightly closer (50–70 cm)";
        } else {
          statusPill.className = "bg-emerald-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
          statusIcon.innerText = "✅";
          statusText.innerText = "Optimal distance — Tap Capture";
        }
      } else {
        currentLandmarks = null;
        statusPill.className = "bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm shadow-md flex items-center space-x-2";
        statusIcon.innerText = "⚠️";
        statusText.innerText = "Center your face in camera";
      }

      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await faceMesh.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
